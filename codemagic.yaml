workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA Release
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Unsigned iOS Release
        script: flutter build ios --release --no-codesign
      - name: Package IPA for Sideloadly / AltStore
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r buzdolabinda-ne-var-ios.ipa Payload
    artifacts:
      - buzdolabinda-ne-var-ios.ipa
