name: Flutter Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzdolabinda-ne-var-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  create-release:
    name: 🚀 Create GitHub Release
    needs: [build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: buzdolabinda-ne-var-apk
          path: build-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Buzdolabında Ne Var? v1.0.0 (Build ${{ github.run_number }})"
          body: |
            🌸 **Buzdolabında Ne Var? (Evde Tarif & Malzeme Eşleştirici)**
            - 300 Mutfak Malzemesi Tespiti & Eşleştirme
            - Sevimli Gece/Gündüz Modu (Dark Mode)
            - Fotoğraf Çek & Malzeme Tespit Et
            - Android APK (`app-release.apk`) Dahil!
          files: |
            build-artifacts/app-release.apk
