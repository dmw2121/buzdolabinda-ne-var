name: Flutter Build APK & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzdolabinda-ne-var-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ipa:
    name: Build iOS App
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/ || true
          zip -r buzdolabinda-ne-var-ios.ipa Payload || true

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzdolabinda-ne-var-ipa
          path: buzdolabinda-ne-var-ios.ipa

  create-release:
    name: Create GitHub Release
    needs: [build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: buzdolabinda-ne-var-apk
          path: build-artifacts

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: buzdolabinda-ne-var-ipa
          path: build-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Buzdolabında Ne Var? v1.0.0 (Build ${{ github.run_number }})"
          body: |
            🌸 **Buzdolabında Ne Var? (Evde Tarif & Malzeme Eşleştirici)**
            - 300 Mutfak Malzemesi Tespiti & Eşleştirme
            - Sevimli Gece/Gündüz Modu (Dark Mode)
            - Fotoğraf Çek & Malzeme Tespit Et
            - Android APK İndirme Bağlantısı Dahil!
          files: |
            build-artifacts/*.apk
            build-artifacts/*.ipa
