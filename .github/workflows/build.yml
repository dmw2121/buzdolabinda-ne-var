name: Flutter Build APK & IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzdolabinda-ne-var-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ipa:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios
          pod install || true
          cd ..

      - name: Build iOS App with Xcode (No Code Signing)
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons || true
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build || true
          fi

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R build/ios/iphoneos/Runner.app Payload/
          elif [ -d "ios/build/Build/Products/Release-iphoneos/Runner.app" ]; then
            cp -R ios/build/Build/Products/Release-iphoneos/Runner.app Payload/
          fi
          zip -r buzdolabinda-ne-var-ios.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzdolabinda-ne-var-ipa
          path: buzdolabinda-ne-var-ios.ipa

  create-release:
    name: Create GitHub Release
    needs: [build-apk, build-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: buzdolabinda-ne-var-apk
          path: build-artifacts

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: buzdolabinda-ne-var-ipa
          path: build-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Buzdolabında Ne Var? v1.0.0 (Build ${{ github.run_number }})"
          body: |
            🌸 **Buzdolabında Ne Var? (Evde Tarif & Malzeme Eşleştirici)**
            - 300 Mutfak Malzemesi Tespiti & Eşleştirme
            - Sevimli Gece/Gündüz Modu (Dark Mode)
            - Fotoğraf Çek & Malzeme Tespit Et
            - Android APK (`app-release.apk`) ve iOS IPA (`buzdolabinda-ne-var-ios.ipa`) Dahil!
          files: |
            build-artifacts/app-release.apk
            build-artifacts/buzdolabinda-ne-var-ios.ipa
