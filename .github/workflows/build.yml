name: Flutter Build iOS IPA Only

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: 🍏 Build Unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release App (No Code Signing)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r buzdolabinda-ne-var-ios.ipa Payload
          ls -lh buzdolabinda-ne-var-ios.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzdolabinda-ne-var-ipa
          path: buzdolabinda-ne-var-ios.ipa

  create-release:
    name: 🚀 Create GitHub Release
    needs: [build-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: buzdolabinda-ne-var-ipa
          path: build-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Buzdolabında Ne Var? iOS v1.0.0 (Build ${{ github.run_number }})"
          body: |
            🌸 **Buzdolabında Ne Var? (Evde Tarif & Malzeme Eşleştirici)**
            - 300 Mutfak Malzemesi Tespiti & Eşleştirme
            - Sevimli Gece/Gündüz Modu (Dark Mode)
            - Fotoğraf Çek & Malzeme Tespit Et
            - iOS IPA (`buzdolabinda-ne-var-ios.ipa`) Sideloadly / AltStore / TrollStore Yüklenebilir Paket!
          files: |
            build-artifacts/buzdolabinda-ne-var-ios.ipa
